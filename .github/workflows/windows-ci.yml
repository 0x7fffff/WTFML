name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Configure
        run: cmake --preset ci-verification

      - name: Build
        run: cmake --build --preset ci-verification

      - name: Test
        run: ctest --preset ci-verification
