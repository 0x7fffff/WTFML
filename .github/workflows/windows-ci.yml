name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      visual:
        description: "Run the full UI suite (includes known unstable cases)"
        type: boolean
        default: false
  schedule:
    - cron: "0 19 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [ci-app, ci-core, ci-ui, ci-integration]
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: wtfml-qt6101-mingw1310-ci-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CMAKE_CXX_COMPILER_LAUNCHER: sccache

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Check build tools
        run: |
          Get-Command ninja, g++, sccache | Select-Object Name, Source
          & g++ --version
          & sccache --show-stats

      - name: Build and test
        run: ./tools/test.ps1 -Suite ${{ matrix.suite }} -BuildDir build/ci -ConfigurePreset ci-verification -BuildTimeoutSeconds 900 -BuildJobs 2

      - name: Full UI verification
        if: ${{ success() && matrix.suite == 'ci-ui' && (github.event_name == 'schedule' || inputs.visual == true) }}
        run: ./tools/test.ps1 -Suite visual -BuildDir build/ci -NoBuild

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/test-runs/**/summary.json
            build/test-runs/**/*.log
            build/test-runs/**/results.xml
            build/test-runner-selfchecks/**/*.output.log
            build/test-runner-selfchecks/**/summary.json
            build/ci-partition-checks/**
            build/ci/Testing/Temporary/**
            build/ci/**/download-tool-preview.png

  # Keep the existing aggregate check name for branch-protection rules.
  build-and-test:
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification partition
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Verification partitions did not all succeed: $RESULT"
            exit 1
          fi
