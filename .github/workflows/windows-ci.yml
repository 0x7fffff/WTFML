name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      visual:
        description: "Run the full UI suite (includes known unstable cases)"
        type: boolean
        default: false
  schedule:
    - cron: "0 19 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.impact.outputs.suites }}
      modules: ${{ steps.impact.outputs.modules }}
      run_tests: ${{ steps.impact.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected modules
        id: impact
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $full = $env:EVENT_NAME -notin @('push', 'pull_request') -or $env:REF_TYPE -eq 'tag' -or $env:BASE_SHA -match '^0+$'
          if (-not $full) {
            git cat-file -e "$($env:BASE_SHA)^{commit}"
            if ($LASTEXITCODE -ne 0) { $full = $true }
          }
          $global:LASTEXITCODE = 0
          ./tools/test-impact.ps1 -BaseRef $env:BASE_SHA -Full:$full -GitHubOutput

  repo-rules:
    name: repo-rules
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check doc links and repo layout
        shell: pwsh
        run: |
          ./tools/check-doc-links.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/check-repo-layout.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 界面中文必须包在 tr() 里才翻得出来；基线见 tools/i18n-baseline.txt
          ./tools/check-i18n.ps1

  verify:
    needs: plan
    if: ${{ needs.plan.outputs.run_tests == 'true' }}
    name: ${{ matrix.suite }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: wtfml-qt6101-mingw1310-ci-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      TEST_MODULES: ${{ needs.plan.outputs.modules }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Check build tools
        run: |
          Get-Command ninja, g++, sccache | Select-Object Name, Source
          & g++ --version
          & sccache --show-stats

      - name: Build and test
        run: ./tools/test.ps1 -Suite ${{ matrix.suite }} -Modules $env:TEST_MODULES -BuildDir build/ci -ConfigurePreset ci-verification -BuildTimeoutSeconds 900 -BuildJobs 2

      # 编译器缓存没生效时构建照样是绿的；把命中统计写进步骤日志，
      # 免得以后只能凭"CI 怎么还是这么慢"猜。缓存服务故障由 SCCACHE_IGNORE_SERVER_IO_ERROR
      # 退回真实编译，所以这一步只看、不判失败。
      - name: Record compiler cache usage
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            & sccache --show-stats
          } else {
            Write-Output 'sccache: not available'
          }
          $cacheFile = 'build/ci/CMakeCache.txt'
          if (Test-Path $cacheFile) {
            $line = Select-String -Path $cacheFile -Pattern '^CMAKE_CXX_COMPILER_LAUNCHER:'
            if ($line) { Write-Output $line.Line } else { Write-Output 'CMAKE_CXX_COMPILER_LAUNCHER: missing from CMakeCache.txt' }
          } else {
            Write-Output "CMakeCache.txt not found at $cacheFile"
          }

      - name: Full UI verification
        if: ${{ success() && matrix.suite == 'ci-ui' && (github.event_name == 'schedule' || inputs.visual == true) }}
        run: ./tools/test.ps1 -Suite visual -BuildDir build/ci -BuildTimeoutSeconds 900

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/test-runs/**/summary.json
            build/test-runs/**/*.log
            build/test-runs/**/results.xml
            build/ci/test-targets.txt
            build/test-runner-selfchecks/**/*.output.log
            build/test-runner-selfchecks/**/summary.json
            build/ci-partition-checks/**
            build/ci/Testing/Temporary/**
            build/ci/**/download-tool-preview.png

  # Keep the existing aggregate check name for branch-protection rules.
  build-and-test:
    if: ${{ always() }}
    needs: [plan, verify, repo-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification partition
        env:
          RESULT: ${{ needs.verify.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_TESTS: ${{ needs.plan.outputs.run_tests }}
          RULES_RESULT: ${{ needs.repo-rules.result }}
        run: |
          if [ "$RULES_RESULT" != "success" ]; then
            echo "Repo rules check failed: $RULES_RESULT"
            exit 1
          fi
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "Test planning failed: $PLAN_RESULT"
            exit 1
          fi
          if [ "$RUN_TESTS" = "false" ] && [ "$RESULT" = "skipped" ]; then
            echo "Documentation-only change: no compiled tests required"
            exit 0
          fi
          if [ "$RESULT" != "success" ]; then
            echo "Verification partitions did not all succeed: $RESULT"
            exit 1
          fi
